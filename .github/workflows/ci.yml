name: JARVIS CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    # Node 24: the runtime the README documents for development ("developed on
    # Node 24 / npm 11") and above the >=22 floor declared by the installed
    # @supabase/* packages (they emitted EBADENGINE warnings under 20.19).
    - name: Use Node.js 24
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    # @jarvis/shared is consumed through its package.json exports
    # (dist/index.js + dist/index.d.ts) and dist/ is gitignored, so the
    # workspace has to be compiled before anything type-checks or imports it.
    # Without this the backend typecheck failed with TS2307
    # "Cannot find module '@jarvis/shared'" on a clean checkout.
    - name: Build workspace dependency (@jarvis/shared)
      run: npm run build:shared

    - name: Run Typecheck (Backend)
      run: npm run typecheck

    - name: Run Unit Tests
      run: npm run test

    - name: Production Build
      run: npm run build

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps

    - name: Run E2E Smoke Tests
      run: npm run test:e2e

    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        # playwright.config.ts lives in apps/frontend, so its html report is
        # written there — the previous root-level 'playwright-report/' path
        # never matched and no artifact was ever uploaded.
        path: apps/frontend/playwright-report/
        retention-days: 7
